<text x="61.199999999999996" y="259.0" font-family="Aptos,Arial,sans-serif" font-size="25.0" font-weight="400" fill="#0D3560">P21 chọn stable17 từ FIT qua MI/L1/ExtraTrees, 5 selector seed; 14 biến chung trong 5 bộ. RF17 model fit 84,600 s; selector 225,250 s; cộng 309,850 s, so RF42 fit 241,119 s. Chưa phải chi phí end-to-end. RF17 lịch sử đổi cả số cây và min leaf, không phải FS-only ablation.</text>

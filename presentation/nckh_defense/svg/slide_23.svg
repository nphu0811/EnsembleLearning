<text x="61.199999999999996" y="178.20000000000002" font-family="Aptos,Arial,sans-serif" font-size="27.0" font-weight="700" fill="#1769AA">Vì sao dùng UNSW-NB15?</text>
<text x="61.199999999999996" y="259.0" font-family="Aptos,Arial,sans-serif" font-size="25.0" font-weight="400" fill="#0D3560">Có nhãn nhị phân và official split phù hợp đối chiếu tái lập. Giữ nguyên 175.341 TRAIN / 82.332 TEST. Kết quả chỉ thuộc benchmark; cần validation theo thời gian hoặc nguồn mạng khác trước khi khái quát.</text>
<text x="61.199999999999996" y="462.40000000000003" font-family="Aptos,Arial,sans-serif" font-size="16.0" font-weight="400" fill="#526A81">Trả lời cốt lõi trong 15–25 giây; chỉ mở khi hội đồng hỏi.</text>

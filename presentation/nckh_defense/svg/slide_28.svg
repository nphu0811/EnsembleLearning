<text x="61.199999999999996" y="178.20000000000002" font-family="Aptos,Arial,sans-serif" font-size="27.0" font-weight="700" fill="#1769AA">Vì sao không chỉ dùng Accuracy?</text>
<text x="61.199999999999996" y="259.0" font-family="Aptos,Arial,sans-serif" font-size="25.0" font-weight="400" fill="#0D3560">Macro-F1 cho hai lớp trọng số bằng nhau; MCC dùng cả TN/FP/FN/TP. Precision Attack = TP/(TP+FP); Recall = TP/(TP+FN). FPR = FP/(TN+FP); FNR = FN/(TP+FN). Attack là lớp dương. Accuracy che được lỗi khi phân bố lớp đổi.</text>
<text x="61.199999999999996" y="462.40000000000003" font-family="Aptos,Arial,sans-serif" font-size="16.0" font-weight="400" fill="#526A81">Trả lời cốt lõi trong 15–25 giây; chỉ mở khi hội đồng hỏi.</text>
<text x="770.4" y="20.64" font-family="Aptos,Arial,sans-serif" font-size="12.0" font-weight="400" fill="#1769AA">Về kết luận</text>

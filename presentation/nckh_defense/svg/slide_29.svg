<text x="61.199999999999996" y="178.20000000000002" font-family="Aptos,Arial,sans-serif" font-size="27.0" font-weight="700" fill="#1769AA">Vì sao không nói hai mô hình tương đương?</text>
<text x="61.199999999999996" y="259.0" font-family="Aptos,Arial,sans-serif" font-size="25.0" font-weight="400" fill="#0D3560">CI 95% paired bootstrap của chênh Macro-F1/MCC chứa 0: chưa thấy khác biệt rõ theo phép đo đó. Không phải kiểm định tương đương. McNemar đo đúng/sai tổng thể, không trực tiếp Macro-F1. Bootstrap hàng dữ liệu không ước lượng biến thiên huấn luyện.</text>
<text x="61.199999999999996" y="462.40000000000003" font-family="Aptos,Arial,sans-serif" font-size="16.0" font-weight="400" fill="#526A81">Trả lời cốt lõi trong 15–25 giây; chỉ mở khi hội đồng hỏi.</text>

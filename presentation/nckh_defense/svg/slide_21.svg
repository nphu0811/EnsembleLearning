<text x="41.76" y="516.1600000000001" font-family="Aptos,Arial,sans-serif" font-size="10.0" font-weight="400" fill="#526A81">Phụ lục vấn đáp · V6 §3.1, §5.3–5.5; P21 aggregate</text>
<text x="871.1999999999999" y="516.0" font-family="Aptos,Arial,sans-serif" font-size="12.0" font-weight="400" fill="#526A81">21</text>
<line x1="43.199999999999996" y1="488.16" x2="915.84" y2="488.16" stroke="#1769AA"/>
<text x="61.199999999999996" y="178.20000000000002" font-family="Aptos,Arial,sans-serif" font-size="27.0" font-weight="700" fill="#1769AA">Nhóm có phát minh thuật toán mới không?</text>
<text x="61.199999999999996" y="259.0" font-family="Aptos,Arial,sans-serif" font-size="25.0" font-weight="400" fill="#0D3560">Không. Đóng góp trong phạm vi đề tài là benchmark có truy vết, kiểm toán hạn chế, P21 matched và phân tích chi phí lỗi. Không tuyên bố mới trên toàn lĩnh vực.</text>
<text x="61.199999999999996" y="462.40000000000003" font-family="Aptos,Arial,sans-serif" font-size="16.0" font-weight="400" fill="#526A81">Trả lời cốt lõi trong 15–25 giây; chỉ mở khi hội đồng hỏi.</text>
<text x="770.4" y="20.64" font-family="Aptos,Arial,sans-serif" font-size="12.0" font-weight="400" fill="#1769AA">Về kết luận</text>

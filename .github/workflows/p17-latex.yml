name: P17 XeLaTeX build and PDF source QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'report/**'
      - '.github/workflows/p17-latex.yml'

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout frozen working source
        uses: actions/checkout@v4

      - name: Compile Vietnamese report with XeLaTeX and BibTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: report
          latexmk_use_xelatex: true

      - name: Check PDF exists and report unresolved citations
        shell: bash
        run: |
          set -euo pipefail
          test -s report/main.pdf
          test -s report/main.log
          echo "PDF size:"
          wc -c < report/main.pdf
          echo "LaTeX warning summary:"
          grep -En 'LaTeX Warning|Package .* Warning|Overfull \\hbox|Underfull \\hbox|Missing character|Undefined control sequence' report/main.log | tail -n 60 || true
          if grep -Eq 'Citation .* undefined|There were undefined (references|citations)|There were multiply-defined labels' report/main.log; then
            echo 'Blocking: unresolved citations/references/labels in final log'
            exit 1
          fi
          if command -v pdfinfo >/dev/null 2>&1; then
            pdfinfo report/main.pdf | grep -E 'Pages:|Page size:|File size:'
          fi

      - name: Upload PDF and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p17-report-pdf-and-logs
          if-no-files-found: warn
          retention-days: 14
          path: |
            report/main.pdf
            report/main.log
            report/main.blg
            report/main.bbl
            report/main.fls

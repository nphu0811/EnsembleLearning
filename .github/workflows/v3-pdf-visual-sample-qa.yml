name: V3 PDF visual sample preflight

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v3-pdf-visual-sample-qa.yml"
      - "exports/report_revision_v3_2026_10_19/Bao_cao_NCKH_EnsembleLearning_REVISION_V3.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends poppler-utils
      - name: Verify and render selected pages of accepted V3
        shell: bash
        run: |
          set -euo pipefail
          PDF="exports/report_revision_v3_2026_10_19/Bao_cao_NCKH_EnsembleLearning_REVISION_V3.pdf"
          DIR="docs/research/v3_visual_samples_2026_10_19"
          mkdir -p "$DIR"
          test -s "$PDF"
          pages=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          test "$pages" -eq 56
          for page in 1 5 30 39 43 47 52 56; do
            file="$DIR/page_$(printf '%02d' "$page")"
            pdftoppm -f "$page" -l "$page" -r 96 -png -singlefile "$PDF" "$file"
            test -s "$file.png"
          done
          python3 - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path
          pdf=Path("exports/report_revision_v3_2026_10_19/Bao_cao_NCKH_EnsembleLearning_REVISION_V3.pdf")
          result=subprocess.run(["pdftotext","-bbox",str(pdf),"-"],check=True,capture_output=True,text=True)
          root=ET.fromstring(result.stdout)
          ns={"x":"http://www.w3.org/1999/xhtml"}
          pages=root.findall(".//x:page",ns)
          if len(pages)!=56:
              raise ValueError(f"Unexpected bbox count: {len(pages)}")
          found=0
          for idx,page in enumerate(pages,start=1):
              w,h=float(page.attrib["width"]),float(page.attrib["height"])
              for word in page.findall(".//x:word",ns):
                  found+=1
                  x0,y0,x1,y1=(float(word.attrib[k]) for k in ("xMin","yMin","xMax","yMax"))
                  if not (x0>=-0.5 and y0>=-0.5 and x1<=w+0.5 and y1<=h+0.5 and x1>=x0 and y1>=y0):
                      raise ValueError(f"Out-of-page glyph page {idx}: {(x0,y0,x1,y1)}")
          if found<2000:
              raise ValueError(f"Too little selectable text: {found} words")
          print(f"PASS: 56 pages and {found} word boxes entirely inside page bounds")
          PY
          cat > "$DIR/QA.md" <<EOF
          # V3 sampled-page visual QA — 2026-10-19

          - Source PDF: $PDF
          - Pages: $pages
          - Rendered previews: 1, 5, 30, 39, 43, 47, 52, 56 at 96 DPI.
          - Machine validation: pdfinfo 56 pages; pdftotext word bounding boxes inside each page.
          - Warning: sample images are NOT proof of perfect typography on all 56 pages; inspect images before print.
          EOF
      - name: Commit preview evidence
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/v3_visual_samples_2026_10_19
          if ! git diff --cached --quiet; then
            git commit -m "QA: V3 sample PDF pages and in-page bbox checks"
            BRANCH=$(git symbolic-ref --short HEAD)
            git push origin "HEAD:$BRANCH"
          fi
      - name: Upload previews for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NCKH_V3_PDF_visual_samples
          path: docs/research/v3_visual_samples_2026_10_19
          if-no-files-found: warn

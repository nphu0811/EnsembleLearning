name: P15 local watchdog safety tests
on:
  push:
    paths:
      - "tools/p15_local_supervisor.py"
      - "tools/p15_local_worker.py"
      - "tools/p15_fulltrain_preflight.py"
      - "tests/test_p15_local_supervisor.py"
      - ".github/workflows/p15-local-watchdog-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows_guard_tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install watcher dependency (no ML training)
        run: python -m pip install psutil
      - name: Run fixture-only tests (never load UNSW data)
        run: python -m unittest discover -s tests -p "test_p15_local_supervisor.py" -v

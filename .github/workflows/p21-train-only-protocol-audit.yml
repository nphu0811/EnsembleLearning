name: P21 TRAIN-only study protocol static QA

on:
  push:
    paths:
      - "config/p21_train_only_protocol_2026_10_18.json"
      - "tools/p21_protocol_validator.py"
      - "tests/test_p21_train_only_protocol.py"
      - "tools/p21_pilot_guards.py"
      - "tools/p21_pilot_worker.py"
      - "tools/p21_pilot_supervisor.py"
      - "tests/test_p21_pilot_guards.py"
      - "tests/test_p21_pilot_split_synthetic.py"
      - "tools/p21_verify_pilot_reports.py"
      - "tests/test_p21_pilot_report_acceptance.py"
      - "results/controlled_extensions/p21_train_only_pilot_rf42_*/**"
      - ".github/workflows/p21-train-only-protocol-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile fixture-safe audit module (NO model training)
        run: |
          python -m py_compile tools/p21_protocol_validator.py
          python -m py_compile tests/test_p21_train_only_protocol.py
          python -m py_compile tools/p21_pilot_guards.py tools/p21_pilot_worker.py tools/p21_pilot_supervisor.py tests/test_p21_pilot_guards.py
          python -m py_compile tools/p21_verify_pilot_reports.py tests/test_p21_pilot_report_acceptance.py
      - name: Run protocol tests (NO raw TRAIN/TEST)
        run: python -m unittest discover -s tests -p "test_p21_train_only_protocol.py" -v
      - name: Test P21 pilot hard safety gates using synthetic fixtures only
        run: python -m unittest discover -s tests -p "test_p21_pilot_guards.py" -v
      - name: Verify 5 pilot acceptance regression tests (metadata only)
        run: python -m unittest discover -s tests -p "test_p21_pilot_report_acceptance.py" -v
      - name: Accept author-provided RF42 pilot report evidence only
        run: python tools/p21_verify_pilot_reports.py
      - name: Show historical tracked file SHA256
        run: |
          sha256sum src/models/run_unsw_phase9_final_holdout.py
          sha256sum results/tuning/unsw_nb15/phase8_controlled/freeze_candidates.json
          sha256sum results/feature_selection/unsw_nb15/stage2/subsets/stage2_candidate_subsets.json
          git ls-files --eol results/tuning/unsw_nb15/phase8_controlled/freeze_candidates.json results/feature_selection/unsw_nb15/stage2/subsets/stage2_candidate_subsets.json
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          for name in [
              'results/tuning/unsw_nb15/phase8_controlled/freeze_candidates.json',
              'results/feature_selection/unsw_nb15/stage2/subsets/stage2_candidate_subsets.json',
          ]:
              data = Path(name).read_bytes()
              print('CRLF normalized diagnostic', name,
                    'LF count', data.count(b'\n'),
                    'CRLF SHA256', sha256(data.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')).hexdigest())
          PY
      - name: Verify P21 contract and three frozen historical file hashes
        run: python tools/p21_protocol_validator.py

  synthetic_group_split:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML libraries for synthetic-only split validation
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Group-disjoint split tests on fabricated rows (NO TRAIN, TEST OR FIT)
        run: python -m unittest discover -s tests -p "test_p21_pilot_split_synthetic.py" -v

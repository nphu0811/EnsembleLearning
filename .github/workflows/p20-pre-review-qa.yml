name: P20-PRE frozen AI review evidence QA

on:
  push:
    paths:
      - "tools/p20_verify_committed_reviews.py"
      - "tools/p20_validate_pre_review.py"
      - "tests/test_p20_anchor_erratum.py"
      - "defense/p20_pre_2026_10_17_01/reviewer_*/**"
      - "defense/p20_pre_2026_10_17_01/review_reports_frozen.json"
      - "defense/p20_pre_2026_10_17_01/synthesis/**"
      - ".github/workflows/p20-pre-review-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-evidence-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile review QA scripts
        run: |
          python -m py_compile tools/p20_verify_committed_reviews.py
          python -m py_compile tools/p20_validate_pre_review.py
          python -m py_compile tests/test_p20_anchor_erratum.py
      - name: Test strict citation exception boundaries
        run: |
          python -m unittest discover -s tests -p "test_p20_anchor_erratum.py" -v
      - name: Audit committed reviewer report hashes, concern map and source anchors
        run: |
          python tools/p20_verify_committed_reviews.py --out "$RUNNER_TEMP/p20-review-qa.json"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p20-pre-review-evidence-audit
          path: ${{ runner.temp }}/p20-review-qa.json
          if-no-files-found: warn
